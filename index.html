<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mmhoss | Portfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2e2e3e;
      --accent: #7c6af7;
      --accent2: #5eead4;
      --text: #e2e2f0;
      --muted: #8888aa;
      --radius: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,15,19,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .nav-brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
    .nav-links { display: flex; gap: 1.5rem; list-style: none; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .2s; }
    .nav-links a:hover { color: var(--text); }

    /* ── Sections ── */
    section { padding: 5rem 2rem; max-width: 900px; margin: 0 auto; }

    /* ── Hero ── */
    #hero {
      min-height: calc(100vh - 60px);
      display: flex; flex-direction: column; justify-content: center;
      padding-top: 4rem; padding-bottom: 4rem;
    }
    .tag {
      display: inline-block;
      background: rgba(124,106,247,.15);
      color: var(--accent);
      border: 1px solid rgba(124,106,247,.3);
      border-radius: 999px;
      font-size: .8rem; font-weight: 600;
      padding: .25rem .75rem;
      margin-bottom: 1.5rem;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    h1 { font-size: clamp(2.2rem, 6vw, 3.8rem); font-weight: 800; line-height: 1.15; margin-bottom: 1rem; }
    h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-sub { font-size: 1.15rem; color: var(--muted); max-width: 560px; margin-bottom: 2.5rem; }
    .btn-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .65rem 1.4rem; border-radius: var(--radius);
      font-size: .95rem; font-weight: 600; text-decoration: none;
      transition: transform .15s, box-shadow .15s;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Section headings ── */
    h2 {
      font-size: 1.75rem; font-weight: 700; margin-bottom: .5rem;
      display: flex; align-items: center; gap: .6rem;
    }
    h2::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .section-sub { color: var(--muted); margin-bottom: 2.5rem; font-size: .95rem; }

    /* ── Cards ── */
    .card-grid { display: grid; gap: 1.25rem; }
    @media (min-width: 640px) { .card-grid { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: border-color .2s, transform .2s;
    }
